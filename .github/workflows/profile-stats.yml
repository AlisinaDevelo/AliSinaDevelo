name: Profile stats

# Refreshes the "GitHub at a glance" line in README.md from the GitHub API.
# Runs on GitHub's own infrastructure with the built-in GITHUB_TOKEN — no PAT,
# no third-party service, output committed as plain Markdown.

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute stats and inject into README
        env:
          GH_TOKEN: ${{ github.token }}
          USER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          repos_json=$(gh api "users/$USER/repos?per_page=100&type=owner" \
            --jq '[.[] | select(.fork==false)]')
          repos=$(echo "$repos_json" | jq 'length')
          stars=$(echo "$repos_json" | jq 'map(.stargazers_count) | add // 0')
          followers=$(gh api "users/$USER" --jq '.followers')

          line="\`$followers\` followers&nbsp;·&nbsp;\`$repos\` public repos&nbsp;·&nbsp;\`$stars\` stars earned"

          python3 - "$line" <<'PY'
          import pathlib, re, sys
          line = sys.argv[1]
          p = pathlib.Path("README.md")
          text = p.read_text(encoding="utf-8")
          new = re.sub(
              r"(<!-- STATS:START -->).*?(<!-- STATS:END -->)",
              lambda m: f"{m.group(1)}\n{line}\n{m.group(2)}",
              text,
              flags=re.S,
          )
          if new != text:
              p.write_text(new, encoding="utf-8")
              print("stats updated")
          else:
              print("stats unchanged")
          PY

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh profile stats"
            git push
          else
            echo "no change"
          fi
